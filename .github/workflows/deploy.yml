name: Deploy Telegram Serverless Bot

on:
  push:
    branches:
      - main  # Or 'master', depending on your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # tgcloud CLI requires Node.js 18 or newer

      - name: Install Dependencies
        run: npm ci

      - name: Build Project (if build script exists)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found, skipping..."
          fi

      - name: Deploy to Telegram Serverless
        run: npx tgcloud push
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          TGCLOUD_ASSUME_TTY: 1  # Helps avoid TTY-related errors in CI